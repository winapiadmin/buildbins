name: cutechess build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  QT_VERSION: 6.7.2

jobs:

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtbase qttools qt5compat

      # ---------------- Linux/macOS ----------------
      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake -S . -B build \
            -DWITH_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: cmake --build build -j"$(nproc)"

      # ---------------- Windows ----------------
      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cmake -S . -B build ^
            -DWITH_TESTS=OFF ^
            -DCMAKE_BUILD_TYPE=Release ^
            -G "Ninja"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: cmake --build build --config Release

      # ---------------- Install (Linux AppDir) ----------------
      - name: Install AppDir (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cmake --install build --prefix /usr --component Runtime DESTDIR=AppDir

      - name: Install AppImage tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd build

          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x *.AppImage

          ./linuxdeploy-x86_64.AppImage \
            --appdir ../AppDir \
            --plugin qt \
            --output appimage \
            --icon-file=../projects/gui/res/icons/cutechess_256x256.png \
            --executable ../AppDir/usr/bin/cutechess \
            --executable ../AppDir/usr/bin/cutechess-cli

          APPIMAGE=$(find . -name "*.AppImage" | head -n 1)
          mv "$APPIMAGE" "CuteChess-${GITHUB_REF_NAME}-x86_64.AppImage"

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/*.AppImage

      # ---------------- Windows packaging ----------------
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $dir = "CuteChess-$version-win64"

          mkdir $dir

          Copy-Item build\cutechess.exe $dir
          Copy-Item build\cutechess-cli.exe $dir

          Copy-Item "$env:Qt6_DIR\bin\*.dll" $dir -ErrorAction SilentlyContinue

          Compress-Archive $dir "$dir.zip"

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/** --draft --title "CuteChess $GITHUB_REF_NAME"
