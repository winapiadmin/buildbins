name: cutechess build

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "cutechess repo URL"
        required: false
        default: "https://github.com/cutechess/cutechess"
      repo_branch:
        description: "cutechess repo branch"
        required: false
        default: "master"
      repo_commit:
        description: "Commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1. MATRIX BUILD (CI)
# ------------------------------------------------------------
  build:
    name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        qt_version: [5.15.2, 6.7.2]
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
            qt_version: 5.15.2

    steps:
      - name: Checkout target repository (clone by URL)
        shell: bash
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          echo "Cloning $REPO_URL"
          git clone "$REPO_URL" src
          cd src
          # Try to check out commit, branch or tag. Be forgiving: fetch refs if needed.
          set -e
          if [ -n "${{ github.event.inputs.repo_commit }}" ]; then
            echo "Checking out commit $REPO_REF"
            git fetch --depth=1 origin "$REPO_REF" || true
            git checkout "$REPO_REF"
          else
            echo "Checking out ref $REPO_REF"
            git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
          fi
        env:
          # keep runner quiet about any GIT_TRACE etc.
          GIT_TERMINAL_PROMPT: 0

      - name: Get branch + commit (from checked-out repo)
        shell: bash
        run: |
          cd src
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "BRANCH=$SANITIZED_BRANCH" >> $GITHUB_ENV
          case "${{ matrix.os }}" in
            "ubuntu-latest") echo "ARCH=linux-x86_64" >> $GITHUB_ENV ;;
            "macos-latest")  echo "ARCH=macos-x86_64" >> $GITHUB_ENV ;;
            "windows-latest") echo "ARCH=windows-x86_64" >> $GITHUB_ENV ;;
            *) echo "ARCH=unknown" >> $GITHUB_ENV ;;
          esac

      - name: Install Qt 5
        if: startsWith(matrix.qt_version, '5.')
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_version }}

      - name: Install Qt 6
        if: startsWith(matrix.qt_version, '6.')
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_version }}
          modules: qt5compat

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: src
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja
          cmake --build . -j$(nproc)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Test (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: src
        run: |
          if [ -d build ]; then
            cd build
            ctest --output-on-failure || true
          fi

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          if exist build (
            cd build
            ctest -C Release --output-on-failure || exit 0
          )
# ------------------------------------------------------------
# 1.5 CREATE TAG (after successful build)
# ------------------------------------------------------------
  create_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream repo (compute branch + sha)
        shell: bash
        id: compute
        run: |
          set -e
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          echo "Cloning $REPO_URL @ $REPO_REF"
          rm -rf tmpsrc
          git clone --depth=1 "$REPO_URL" tmpsrc
          cd tmpsrc || exit 1
          # be forgiving: try to check out requested ref if it's a commit / tag / branch
          git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TAG="cutechess-${SANITIZED_BRANCH}-${SHORT_SHA}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$TAG" >> $GITHUB_ENV
      - name: Create & push tag in this repo (repo A)
        id: make_tag
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          TAG="${{ steps.compute.outputs.tag }}"
          # Avoid recreating the same tag
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping push"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

# ------------------------------------------------------------
# 2. CREATE RELEASE (tags only)
# ------------------------------------------------------------
  release:
    needs: create_tag
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.rel.outputs.upload_url }}
      tag: ${{ needs.create_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: rel
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create_tag.outputs.tag }}
          release_name: "cutechess in ${{ needs.create_tag.outputs.tag }}"
          draft: true

  linuxrel:
      needs: release
      name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          qt_version: [6.7.2]
          os: [ubuntu-latest]
          build_type: [Debug, RelWithDebInfo]
      steps:
          - name: Checkout target repository (clone by URL)
            shell: bash
            run: |
              REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
              REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
              echo "Cloning $REPO_URL"
              git clone "$REPO_URL" src
              cd src
              # Try to check out commit, branch or tag. Be forgiving: fetch refs if needed.
              set -e
              if [ -n "${{ github.event.inputs.repo_commit }}" ]; then
                echo "Checking out commit $REPO_REF"
                git fetch --depth=1 origin "$REPO_REF" || true
                git checkout "$REPO_REF"
              else
                echo "Checking out ref $REPO_REF"
                git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
              fi
            env:
              # keep runner quiet about any GIT_TRACE etc.
              GIT_TERMINAL_PROMPT: 0

          - name: install qt 6.x
            uses: jurplel/install-qt-action@v3
            with:
              version: ${{ matrix.qt_version }}
              modules: 'qt5compat'

          - name: set version
            working-directory: src 
            run: |
              SHORT_SHA=$(git rev-parse --short HEAD)
              BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
              SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
              TAG="${SANITIZED_BRANCH}-${SHORT_SHA}"
              echo "VERSION=$TAG" >> $GITHUB_ENV

          - name: build cute chess
            working-directory: src 
            run: |
                mkdir build
                cd build
                cmake .. -DWITH_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                cmake --build . --config ${{ matrix.build_type }}
                make install DESTDIR=AppDir

          - name: download appimage tools
            working-directory: src
            run: |
              sudo apt install libfuse2 libxcb-cursor0
              mkdir build || true
              cd build
              curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              curl -fsLSO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
              chmod +x linuxdeploy-*.AppImage
              
          - name: build appimage
            working-directory: src
            run: |
              cd build
              ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage --custom-apprun=../dist/appimage/CuteChess-AppRun --icon-file=../projects/gui/res/icons/cutechess_256x256.png \
              --executable AppDir/usr/bin/cutechess \
              --executable AppDir/usr/bin/cutechess-cli

          - name: upload release asset
            uses: actions/upload-release-asset@v1
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              upload_url: ${{ needs.release.outputs.upload_url }}
              asset_path: src/build/Cute_Chess-${{ env.VERSION }}-x86_64.AppImage
              asset_name: Cute_Chess-${{ env.VERSION }}-x86_64-${{ matrix.build_type }}.AppImage
              asset_content_type: application/octet-stream

  winrel:
      needs: release
      name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
      runs-on: ${{ matrix.os }}
      env:
        VCDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
        ISDIR: 'C:\Program Files (x86)\Inno Setup 6'
      strategy:
        matrix:
          qt_version: [6.7.2]
          os: [windows-latest]
          build_type: [Debug, RelWithDebInfo]
      steps:
          - name: Checkout target repository (clone by URL)
            shell: bash
            run: |
              REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
              REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
              echo "Cloning $REPO_URL"
              git clone "$REPO_URL" src
              cd src
              # Try to check out commit, branch or tag. Be forgiving: fetch refs if needed.
              set -e
              if [ -n "${{ github.event.inputs.repo_commit }}" ]; then
                echo "Checking out commit $REPO_REF"
                git fetch --depth=1 origin "$REPO_REF" || true
                git checkout "$REPO_REF"
              else
                echo "Checking out ref $REPO_REF"
                git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
              fi
            env:
              # keep runner quiet about any GIT_TRACE etc.
              GIT_TERMINAL_PROMPT: 0

          - name: install qt 6.x
            uses: jurplel/install-qt-action@v3
            with:
              version: ${{ matrix.qt_version }}
              modules: 'qt5compat'

          - name: build cute chess
            working-directory: src
            run: |
                mkdir build
                cd build
                cmake .. -DWITH_TESTS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                cmake --build . --config ${{ matrix.build_type }}

          - name: set version
            shell: bash
            working-directory: src
            run: |
              SHORT_SHA=$(git rev-parse --short HEAD)
              BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
              SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
              TAG="${SANITIZED_BRANCH}-${SHORT_SHA}"
              echo "VERSION=$TAG" >> $GITHUB_ENV

          - name: create a release zip file
            working-directory: src
            run: |
              mkdir cutechess-$env:VERSION-win64
              cd cutechess-$env:VERSION-win64
              cp ..\build\cutechess.exe .
              cp ..\build\cutechess-cli.exe .
              cp ..\docs\cutechess-cli.6.html .
              cp ..\docs\cutechess-cli.6.txt .
              cp ..\docs\cutechess-engines.json.5.html .
              cp ..\docs\cutechess-engines.json.5.txt .
              cp ..\COPYING .
              cp "$env:VCDIR\VC\Redist\MSVC\v143\vc_redist.x64.exe" .
              cp "$env:Qt6_Dir\bin\Qt6Core.dll" .
              cp "$env:Qt6_Dir\bin\Qt6Gui.dll" .
              cp "$env:Qt6_Dir\bin\Qt6Svg.dll" .
              cp "$env:Qt6_Dir\bin\Qt6PrintSupport.dll" .
              cp "$env:Qt6_Dir\bin\Qt6Widgets.dll" .
              cp "$env:Qt6_Dir\bin\Qt6ConCurrent.dll" .
              cp "$env:Qt6_Dir\bin\Qt6Core5Compat.dll" .
              mkdir platforms
              cp "$env:Qt6_Dir\plugins\platforms\qwindows.dll" platforms\
              mkdir styles
              cp "$env:Qt6_Dir\plugins\styles\qmodernwindowsstyle.dll" styles\
              mkdir plugins
              mkdir plugins\iconengines
              cp "$env:Qt6_Dir\plugins\iconengines\qsvgicon.dll" plugins\iconengines
              mkdir plugins\imageformats
              cp "$env:Qt6_Dir\plugins\imageformats\qsvg.dll" plugins\imageformats
              cd ..
              7z a cutechess-$env:VERSION-win64.zip cutechess-$env:VERSION-win64\

          - name: create an installer
            working-directory: src
            run: |
              & "$env:ISDIR\iscc.exe" /DMyAppVersion=$env:VERSION /DQtLibPath=$env:Qt6_Dir /DMSVCPath=$env:VCDIR /DCuteChessPath=$env:GITHUB_WORKSPACE\src dist\windows_setup.iss

          - name: upload zip release asset
            uses: actions/upload-release-asset@v1
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              upload_url: ${{ needs.githubrel.outputs.upload_url }}
              asset_path: src/cutechess-${{ env.VERSION }}-win64.zip
              asset_name: cutechess-${{ env.VERSION }}-win64.zip
              asset_content_type: application/zip
          - name: upload installer release asset
            uses: actions/upload-release-asset@v1
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              upload_url: ${{ needs.release.outputs.upload_url }}
              asset_path: src/dist/cutechess-${{ env.VERSION }}-win64.exe
              asset_name: cutechess-${{ env.VERSION }}-win64-${{ matrix.build_type }}.exe
              asset_content_type: application/octet-stream
