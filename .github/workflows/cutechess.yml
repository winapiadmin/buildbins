name: cutechess build

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "cutechess repo URL"
        required: false
        default: "https://github.com/cutechess/cutechess"
      repo_branch:
        description: "cutechess repo branch"
        required: false
        default: "master"
      repo_commit:
        description: "Commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1. MATRIX BUILD (CI)
# ------------------------------------------------------------
  build:
    name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        qt_version: [5.15.2, 6.7.2]
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
            qt_version: 5.15.2

    steps:
      - name: Checkout target repository (clone by URL)
        shell: bash
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          echo "Cloning $REPO_URL"
          git clone "$REPO_URL" src
          cd src
          # Try to check out commit, branch or tag. Be forgiving: fetch refs if needed.
          set -e
          if [ -n "${{ github.event.inputs.repo_commit }}" ]; then
            echo "Checking out commit $REPO_REF"
            git fetch --depth=1 origin "$REPO_REF" || true
            git checkout "$REPO_REF"
          else
            echo "Checking out ref $REPO_REF"
            git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
          fi
        env:
          # keep runner quiet about any GIT_TRACE etc.
          GIT_TERMINAL_PROMPT: 0

      - name: Get branch + commit (from checked-out repo)
        shell: bash
        run: |
          cd src
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "BRANCH=$SANITIZED_BRANCH" >> $GITHUB_ENV
          case "${{ matrix.os }}" in
            "ubuntu-latest") echo "ARCH=linux-x86_64" >> $GITHUB_ENV ;;
            "macos-latest")  echo "ARCH=macos-x86_64" >> $GITHUB_ENV ;;
            "windows-latest") echo "ARCH=windows-x86_64" >> $GITHUB_ENV ;;
            *) echo "ARCH=unknown" >> $GITHUB_ENV ;;
          esac

      - name: Install Qt 5
        if: startsWith(matrix.qt_version, '5.')
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_version }}

      - name: Install Qt 6
        if: startsWith(matrix.qt_version, '6.')
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_version }}
          modules: qt5compat

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: src
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja
          cmake --build . -j$(nproc)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Test (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: src
        run: |
          if [ -d build ]; then
            cd build
            ctest --output-on-failure || true
          fi

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          if exist build (
            cd build
            ctest -C Release --output-on-failure || exit 0
          )

      - name: Package CI artifact
        shell: bash
        working-directory: ${{ github.workspace }}/src
        if: matrix.os != 'windows-latest'
        run: |
          ART="cutechess-${BRANCH}-${SHORT_SHA}-${ARCH}-qt${{ matrix.qt_version }}"
          mkdir -p out
          # collect probable binaries (be forgiving)
          if [ -d build ]; then
            cp build/cutechess* out/ 2>/dev/null || true
            cp build/Release/cutechess* out/ 2>/dev/null || true
          fi
          # include docs and license if present
          cp -v README* out/ 2>/dev/null || true
          cp -v COPYING out/ 2>/dev/null || true
          tar -czf "$ART.tar.gz" -C out .
          echo "ART=$ART.tar.gz" >> $GITHUB_ENV

      - name: Package CI artifact (Windows)
        shell: pwsh
        working-directory: ${{ github.workspace }}/src
        if: matrix.os == 'windows-latest'
        run: |
          $ART = "cutechess-$env:BRANCH-$env:SHORT_SHA-$env:ARCH-qt${{ matrix.qt_version }}"
          New-Item -ItemType Directory -Force out | Out-Null
        
          if (Test-Path build) {
            Get-ChildItem build -Filter "cutechess*.exe" -Recurse -ErrorAction SilentlyContinue |
              Copy-Item -Destination out -Force
          }
        
          Copy-Item README* -Destination out -ErrorAction SilentlyContinue
          Copy-Item COPYING -Destination out -ErrorAction SilentlyContinue
        
          Compress-Archive -Path out\* -DestinationPath "$ART.zip" -Force
          "ART=$ART.zip" | Out-File -Append $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ github.workspace }}/src/${{ env.ART }}
# ------------------------------------------------------------
# 1.5 CREATE TAG (after successful build)
# ------------------------------------------------------------
  create_tag:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make_tag.outputs.tag }}

    steps:
      - name: Checkout this repository (repo A)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone upstream repo (compute branch + sha)
        shell: bash
        id: compute
        run: |
          set -e
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          echo "Cloning $REPO_URL @ $REPO_REF"
          rm -rf tmpsrc
          git clone --depth=1 "$REPO_URL" tmpsrc
          cd tmpsrc || exit 1
          # be forgiving: try to check out requested ref if it's a commit / tag / branch
          git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD || echo "$GITHUB_REF_NAME")
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TAG="cutechess-${SANITIZED_BRANCH}-${SHORT_SHA}"
          echo "Computed tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$TAG" >> $GITHUB_ENV
      - name: Create & push tag in this repo (repo A)
        id: make_tag
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          TAG="${{ steps.compute.outputs.tag }}"
          # Avoid recreating the same tag
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping push"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

# ------------------------------------------------------------
# 2. CREATE RELEASE (tags only)
# ------------------------------------------------------------
  release:
    needs: create_tag
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.rel.outputs.upload_url }}
      tag: ${{ needs.create_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: rel
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create_tag.outputs.tag }}
          release_name: "cutechess in ${{ needs.create_tag.outputs.tag }}"
          draft: true

# ------------------------------------------------------------
# 3. LINUX APPIMAGE (runs on tag releases)
# ------------------------------------------------------------
  appimage:
    needs: release
    runs-on: ubuntu-latest
  
    steps:
      - name: Download Linux Qt6 artifact
        uses: actions/download-artifact@v4
        with:
          pattern: "*linux-x86_64*"
          merge-multiple: true
          path: artifact
  
      - name: Install AppImage deps
        run: |
          sudo apt update
          sudo apt install -y libfuse2 patchelf
  
      - name: Build AppDir
        shell: bash
        run: |
          mkdir -p AppDir
          cp -R artifact AppDir
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          echo "Cloning $REPO_URL @ $REPO_REF"
          rm -rf tmpsrc
          git clone --depth=1 "$REPO_URL" tmpsrc
          cd tmpsrc || exit 1
          # be forgiving: try to check out requested ref if it's a commit / tag / branch
          git checkout "$REPO_REF" 2>/dev/null || (git fetch --tags --all && git checkout "$REPO_REF")
      - name: Build AppImage
        shell: bash
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -LO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ls -R artifact
          ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir --plugin qt --output appimage \
          --custom-apprun=tmpsrc/dist/appimage/CuteChess-AppRun --icon-file=tmpsrc/projects/gui/res/icons/cutechess_256x256.png \
          --executable AppDir/artifact/cutechess --executable AppDir/artifact/cutechess-cli \
          --desktop-file tmpsrc/dist/linux/cutechess.desktop
          
      - name: Upload Windows installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ${{ env.VERSION }}-x86_64.AppImage
          asset_name: ${{ env.VERSION }}-x86_64.AppImage

# ------------------------------------------------------------
# 4. WINDOWS ZIP + SETUP (runs on tag releases)
# ------------------------------------------------------------
  winsetup:
    needs: release
    runs-on: windows-latest

    env:
      ISDIR: 'C:\Program Files (x86)\Inno Setup 6'

    steps:
      - name: Checkout target repo for release (Windows)
        shell: bash
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/cutechess/cutechess' }}"
          REPO_REF="${{ github.event.inputs.repo_commit || github.event.inputs.repo_branch || github.ref_name }}"
          git clone "$REPO_URL" src
          cd src
          git fetch --all --tags --depth=1 || true
          git checkout "$REPO_REF" || git checkout -b tmp "$REPO_REF" || true
        env:
          GIT_TERMINAL_PROMPT: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.7.2
          modules: qt5compat

      - name: Build (Windows, release)
        shell: cmd
        working-directory: src
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          cmake .. -DWITH_TESTS=OFF -G "Ninja"
          cmake --build . --config Release

      - name: Create installer (Inno Setup)
        shell: powershell
        working-directory: src
        run: |
          $Iscc = Join-Path $env:ISDIR 'iscc.exe'
          if (-Not (Test-Path $Iscc)) {
              Write-Host "Inno Setup not found at $Iscc"
              exit 1
          }
          & $Iscc dist\windows_setup.iss

      - name: Upload Windows installer to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: src/dist/cutechess-win64.exe
          asset_name: cutechess-${{ github.ref_name }}-win64.exe
          asset_content_type: application/octet-stream
