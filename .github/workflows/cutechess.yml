name: cutechess build

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "cutechess repo URL"
        required: false
        default: "https://github.com/cutechess/cutechess"
      repo_commit:
        description: "Commit SHA (leave empty = upstream default branch HEAD)"
        required: false

permissions:
  contents: write

env:
  DEFAULT_REPO_URL: https://github.com/cutechess/cutechess
  QT_VERSION: 6.7.2

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Fetch upstream source
        id: meta
        shell: bash
        env:
          REPO_URL: ${{ inputs.repo_url || env.DEFAULT_REPO_URL }}
          REPO_COMMIT: ${{ inputs.repo_commit }}
        run: |
          set -euo pipefail

          rm -rf src source.tar.gz
          git clone --no-tags "$REPO_URL" src
          cd src
          git fetch --all --tags

          if [ -n "${REPO_COMMIT}" ]; then
            git checkout "${REPO_COMMIT}"
          else
            DEFAULT_BRANCH="$(git remote show origin | awk '/HEAD branch/ {print $NF}')"
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH=master
            fi
            git fetch --depth=1 origin "$DEFAULT_BRANCH"
            git checkout FETCH_HEAD
          fi

          SHA="$(git rev-parse --short HEAD)"
          TAG="cutechess-${SHA}"

          tar --exclude=.git -czf ../source.tar.gz .
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.tar.gz
          if-no-files-found: error

  build:
    name: "${{ matrix.os }} Qt ${{ env.QT_VERSION }}"
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: source

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          mkdir -p src
          tar -xzf source/source.tar.gz -C src

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtbase qttools qt5compat

      - name: Force Qt path
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "QT_ROOT_DIR is not set"
            exit 1
          fi
          echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Configure Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DWITH_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"

      - name: Install AppDir
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          DESTDIR=AppDir cmake --install build

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0

          cd build
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x *.AppImage

          ./linuxdeploy-x86_64.AppImage \
            --appdir ../AppDir \
            --plugin qt \
            --output appimage \
            --icon-file=../projects/gui/res/icons/cutechess_256x256.png \
            --executable ../AppDir/usr/bin/cutechess \
            --executable ../AppDir/usr/bin/cutechess-cli

          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' | head -n1)"
          mv "$APPIMAGE" "CuteChess-${TAG}-linux.AppImage"

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src/build/CuteChess-${{ env.TAG }}-linux.AppImage
          if-no-files-found: error

      - name: Configure Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja -DWITH_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        working-directory: src
        run: |
          cmake --build build

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:TAG
          $qt = $env:QT_ROOT_DIR
          if (-not $qt) {
            $qt = $env:CMAKE_PREFIX_PATH
          }
          if (-not $qt) {
            throw "Qt root directory not found"
          }

          $dir = "CuteChess-$tag-win64"
          New-Item -ItemType Directory -Force $dir | Out-Null

          Copy-Item .\build\cutechess.exe $dir
          Copy-Item .\build\cutechess-cli.exe $dir
          Copy-Item .\docs\cutechess-cli.6.html $dir
          Copy-Item .\docs\cutechess-cli.6.txt $dir
          Copy-Item .\docs\cutechess-engines.json.5.html $dir
          Copy-Item .\docs\cutechess-engines.json.5.txt $dir
          Copy-Item .\COPYING $dir
          Copy-Item "$env:VCDIR\VC\Redist\MSVC\v143\vc_redist.x64.exe" $dir

          Copy-Item "$qt\bin\Qt6Core.dll" $dir
          Copy-Item "$qt\bin\Qt6Gui.dll" $dir
          Copy-Item "$qt\bin\Qt6Svg.dll" $dir
          Copy-Item "$qt\bin\Qt6PrintSupport.dll" $dir
          Copy-Item "$qt\bin\Qt6Widgets.dll" $dir
          Copy-Item "$qt\bin\Qt6Concurrent.dll" $dir
          Copy-Item "$qt\bin\Qt6Core5Compat.dll" $dir

          New-Item -ItemType Directory -Force "$dir\platforms" | Out-Null
          Copy-Item "$qt\plugins\platforms\qwindows.dll" "$dir\platforms"

          New-Item -ItemType Directory -Force "$dir\styles" | Out-Null
          Copy-Item "$qt\plugins\styles\qmodernwindowsstyle.dll" "$dir\styles"

          New-Item -ItemType Directory -Force "$dir\plugins\iconengines" | Out-Null
          New-Item -ItemType Directory -Force "$dir\plugins\imageformats" | Out-Null
          Copy-Item "$qt\plugins\iconengines\qsvgicon.dll" "$dir\plugins\iconengines"
          Copy-Item "$qt\plugins\imageformats\qsvg.dll" "$dir\plugins\imageformats"

          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip" -Force

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src/CuteChess-${{ env.TAG }}-win64.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated build from upstream commit $UPSTREAM_SHA"
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
