name: cutechess build for windows-x86_64

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      repo_url:
        description: "cutechess repo URL"
        required: false
        default: "https://github.com/cutechess/cutechess"
      repo_branch:
        description: "cutechess repo branch"
        required: false
        default: "master"
      repo_commit:
        description: "Commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - qt_version: "5.15.2"
            qt_arch: "win64_msvc2019_64"
            qt_label: "qt5"
          - qt_version: "6.7.2"
            qt_arch: "win64_msvc2022_64"
            qt_label: "qt6"

    env:
      REPO_URL: ${{ github.event.inputs.repo_url }}
      REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      REPO_COMMIT: ${{ github.event.inputs.repo_commit }}

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone cutechess
        shell: cmd
        run: |
          git clone %REPO_URL% src
          cd src
          git checkout %REPO_BRANCH%
          if not "%REPO_COMMIT%"=="" git checkout %REPO_COMMIT%
          for /f %%i in ('git rev-parse --short HEAD') do echo COMMIT_SHA=%%i>>%GITHUB_ENV%

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: all

      - name: Configure
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake ..\src -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%"

      - name: Build
        shell: cmd
        run: |
          cd build
          ninja

      - name: Install (staging)
        shell: cmd
        run: |
          cd build
          cmake --install . --prefix install

      - name: Package
        shell: cmd
        run: |
          cd build\install
          powershell -Command ^
            "Compress-Archive -Path * -DestinationPath ..\cutechess-%REPO_BRANCH%-%COMMIT_SHA%-windows-x86_64-${{ matrix.qt_label }}.zip"
          echo PACKAGE_FILE=cutechess-%REPO_BRANCH%-%COMMIT_SHA%-windows-x86_64-${{ matrix.qt_label }}.zip>>%GITHUB_ENV%

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: cutechess Windows (${{ matrix.qt_label }})
          files: ${{ github.workspace }}/build/${{ env.PACKAGE_FILE }}
          body: |
            cutechess snapshot build for Windows x86_64
            Qt: ${{ matrix.qt_version }}
            Branch: ${{ env.REPO_BRANCH }}
            Commit: ${{ env.COMMIT_SHA }}
