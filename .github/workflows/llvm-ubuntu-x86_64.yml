name: LLVM build for ubuntu-x86_64

on:
  workflow_dispatch:
    inputs:
      llvm_branch:
        description: "LLVM branch (default: main)"
        required: false
        default: "main"
      llvm_commit:
        description: "LLVM commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      LLVM_BRANCH: ${{ github.event.inputs.llvm_branch || github.ref_name }}
      LLVM_COMMIT: ${{ github.event.inputs.llvm_commit }}
      LLVM_REPO_URL: https://github.com/llvm/llvm-project.git
      WORK: ${{ github.workspace }}
      PY_PREFIX: ${{ github.workspace }}/python
      TMPDIR: ${{ github.workspace }}/tmp

    steps:
      # -------------------------
      # Free disk space (base image)
      # -------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk space optimizer
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.0
        with:
          operate_sudo: "True"
          docker_prune: "True"
          apt_clean: "True"

      - name: Prepare workspace
        run: |
          mkdir -p "$TMPDIR"
          mkdir -p "$WORK/destdir"

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential \
            git \
            cmake \
            ninja-build \
            wget \
            zlib1g-dev \
            libzstd-dev \
            zstd \
            libxml2-dev \
            libz3-dev
          sudo apt clean

      # -------------------------
      # Clone LLVM (shallow)
      # -------------------------
      - name: Clone LLVM
        run: |
          cd "$WORK"
          git clone \
            --depth=1 \
            --branch "$LLVM_BRANCH" \
            "$LLVM_REPO_URL"

          if [ -n "$LLVM_COMMIT" ]; then
            cd llvm-project
            git fetch --depth=1 origin "$LLVM_COMMIT"
            git checkout "$LLVM_COMMIT"
          fi

      # -------------------------
      # Build Python (shared)
      # -------------------------
      - name: Build Python 3.12 (shared)
        run: |
          cd "$WORK"
          wget https://www.python.org/ftp/python/3.12.7/Python-3.12.7.tgz
          tar xf Python-3.12.7.tgz
          cd Python-3.12.7

          ./configure \
            --prefix="$PY_PREFIX" \
            --enable-shared \
            --with-ensurepip=install \
            CFLAGS="-O2 -fPIC" \
            LDFLAGS="-Wl,-rpath,$PY_PREFIX/lib"

          make -j$(nproc)
          make install

          rm -rf "$WORK/Python-3.12.7" "$WORK/Python-3.12.7.tgz"

      # -------------------------
      # Configure LLVM
      # -------------------------
      - name: Configure LLVM
        run: |
          cd "$WORK/llvm-project"
          mkdir -p build
          cd build

          cmake -S ../llvm -B . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_ENABLE_PROJECTS=all \
            -DLLVM_ENABLE_RUNTIMES=all \
            -DLLVM_ENABLE_ZLIB=ON \
            -DLLVM_ENABLE_ZSTD=ON \
            -DLLVM_ENABLE_Z3_SOLVER=ON \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DPython3_EXECUTABLE="$PY_PREFIX/bin/python3.12" \
            -DPython3_LIBRARY="$PY_PREFIX/lib/libpython3.12.so" \
            -DPython3_INCLUDE_DIR="$PY_PREFIX/include/python3.12"

      # -------------------------
      # Build LLVM
      # -------------------------
      - name: Build LLVM
        run: |
          cd "$WORK/llvm-project/build"
          ninja -j$(nproc --ignore=2)

      # -------------------------
      # Get commit info
      # -------------------------
      - name: Get commit info
        run: |
          cd "$WORK/llvm-project"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      # -------------------------
      # Install (DESTDIR)
      # -------------------------
      - name: Stage install
        run: |
          cd "$WORK/llvm-project/build"
          DESTDIR="$WORK/destdir" ninja install

          if [ -d "$WORK/destdir/usr/bin" ]; then
            mkdir -p "$WORK/destdir/bin"
            mv "$WORK/destdir/usr/bin/"* "$WORK/destdir/bin/"
            rmdir "$WORK/destdir/usr/bin" || true
          fi

      # -------------------------
      # Package
      # -------------------------
      - name: Package
        run: |
          cd "$WORK"
          FILENAME="llvm-${LLVM_BRANCH}-${COMMIT_SHA}-linux-x86_64.tar.gz"
          tar -C destdir -czf "$FILENAME" .
          echo "PACKAGE_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Create tag for commit (if needed)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd "$WORK/llvm-project"
          TAG="llvm-${LLVM_BRANCH}-${COMMIT_SHA}"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          git tag "$TAG" || true
          git push origin "$TAG" || true

      # -------------------------
      # Publish Release
      # -------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME || github.ref_name }}
          name: LLVM ${{ env.TAG_NAME || github.ref_name }}
          prerelease: true
          files: ${{ github.workspace }}/${{ env.PACKAGE_FILE }}
          body: |
            LLVM snapshot build
            Branch: ${{ env.LLVM_BRANCH }}
            Commit: ${{ env.COMMIT_SHA }}
