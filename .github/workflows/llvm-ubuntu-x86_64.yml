name: LLVM build for ubuntu-x86_64

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      llvm_branch:
        description: "LLVM branch (default: main)"
        required: false
        default: "main"
      llvm_commit:
        description: "LLVM commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      LLVM_BRANCH: ${{ github.event.inputs.llvm_branch || github.ref_name }}
      LLVM_COMMIT: ${{ github.event.inputs.llvm_commit }}
      LLVM_REPO_URL: https://github.com/llvm/llvm-project.git
      WORK: ${{ github.workspace }}
      PY_PREFIX: ${{ github.workspace }}/python

    steps:
      # Building LLVM can take a whopping 60GB of space
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 65536
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            wget \
            zlib1g-dev \
            libzstd-dev \
            zstd \
            libxml2-dev \
            libz3-dev

      # -------------------------
      # Clone LLVM
      # -------------------------
      - name: Clone LLVM
        run: |
          cd $WORK
          git clone \
            --depth=1 \
            --branch "$LLVM_BRANCH" \
            https://github.com/llvm/llvm-project.git
      
          if [ -n "$LLVM_COMMIT" ]; then
            cd llvm-project
            git fetch --depth=1 origin "$LLVM_COMMIT"
            git checkout "$LLVM_COMMIT"
          fi


      # -------------------------
      # Build Python (shared)
      # -------------------------
      - name: Build Python 3.12 (shared)
        run: |
          cd $WORK
          wget https://www.python.org/ftp/python/3.12.7/Python-3.12.7.tgz
          tar xf Python-3.12.7.tgz
          cd Python-3.12.7

          make distclean || true

          ./configure \
            --prefix=$PY_PREFIX \
            --enable-shared \
            --with-ensurepip=install \
            CFLAGS="-O2 -fPIC" \
            LDFLAGS="-Wl,-rpath,$PY_PREFIX/lib"

          make -j$(nproc)
          make install

          ls $PY_PREFIX/lib | grep libpython3.12.so

      # -------------------------
      # Configure LLVM
      # -------------------------
      - name: Configure LLVM
        run: |
          cd $WORK/llvm-project
          mkdir build
          cd build

          cmake -S ../llvm -B . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="/" \
            -DLLVM_ENABLE_PROJECTS=all \
            -DLLVM_ENABLE_RUNTIMES=all \
            -DLLVM_ENABLE_ZLIB=ON \
            -DLLVM_ENABLE_ZSTD=ON \
            -DLLVM_ENABLE_Z3_SOLVER=ON \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DLLVM_INCLUDE_UTILS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DPython3_EXECUTABLE=$PY_PREFIX/bin/python3.12 \
            -DPython3_LIBRARY=$PY_PREFIX/lib/libpython3.12.so \
            -DPython3_INCLUDE_DIR=$PY_PREFIX/include/python3.12

      # -------------------------
      # Build LLVM
      # -------------------------
      - name: Build LLVM
        run: |
          cd $WORK/llvm-project/build
          ninja

      # -------------------------
      # Get commit info
      # -------------------------
      - name: Get commit info
        run: |
          cd $WORK/llvm-project
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      # -------------------------
      # Install (DESTDIR)
      # -------------------------
      - name: Stage install
        run: |
          cd $WORK/llvm-project/build
          DESTDIR=destdir ninja install

          if [ -d destdir/usr/bin ]; then
            mkdir -p destdir/bin
            mv destdir/usr/bin/* destdir/bin/
          fi

      # -------------------------
      # Package
      # -------------------------
      - name: Package
        run: |
          cd $WORK/llvm-project/build
          FILENAME="llvm-${LLVM_BRANCH}-${COMMIT_SHA}-linux-x86_64.tar.gz"
          tar -C destdir -czf "$FILENAME" .
          echo "PACKAGE_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Create tag for commit (if needed)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd $WORK/llvm-project

          TAG="llvm-${LLVM_BRANCH}-${COMMIT_SHA}"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

          git tag "$TAG"
          git push origin "$TAG"

      # -------------------------
      # Publish Release
      # -------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME || github.ref_name }}
          name: LLVM ${{ env.TAG_NAME || github.ref_name }}
          prerelease: true
          files: ${{ github.workspace }}/llvm-project/build/${{ env.PACKAGE_FILE }}
          body: |
            LLVM snapshot build
            Branch: ${{ env.LLVM_BRANCH }}
            Commit: ${{ env.COMMIT_SHA }}
