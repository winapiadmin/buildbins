name: cutechess build for ubuntu-x86_64

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      repo_url:
        description: "cutechess repo URL"
        required: false
        default: "https://github.com/cutechess/cutechess"
      repo_branch:
        description: "cutechess repo branch"
        required: false
        default: "master"
      repo_commit:
        description: "Commit SHA (leave empty for branch HEAD)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      REPO_BRANCH: ${{ github.event.inputs.repo_branch || github.ref_name }}
      REPO_COMMIT: ${{ github.event.inputs.repo_commit }}
      REPO_URL: ${{ github.event.inputs.repo_url }}
      WORK: ${{ github.workspace }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            git \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            qtbase5-dev-tools \
            libqt5svg5-dev
          sudo apt clean

      - name: Clone cutechess
        run: |
          cd "$WORK"
          git clone \
            --depth=1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" \
            cutechess

          if [ -n "$REPO_COMMIT" ]; then
            cd cutechess
            git fetch --depth=1 origin "$REPO_COMMIT"
            git checkout "$REPO_COMMIT"
          fi

      - name: Configure
        run: |
          cd "$WORK/cutechess"
          mkdir -p build
          cd build

          cmake -S .. -B . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG="-fsanitize=address" \
            -DCMAKE_CXX_FLAGS_DEBUG="-fsanitize=address" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cd "$WORK/cutechess/build"
          ninja

      - name: Get commit info
        run: |
          cd "$WORK/cutechess"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Stage install
        run: |
          cd "$WORK/cutechess/build"
          DESTDIR="$WORK/destdir" ninja install

          if [ -d "$WORK/destdir/usr/bin" ]; then
            mkdir -p "$WORK/destdir/bin"
            mv "$WORK/destdir/usr/bin/"* "$WORK/destdir/bin/"
            rmdir "$WORK/destdir/usr/bin" || true
          fi

      - name: Package
        run: |
          cd "$WORK"
          FILENAME="cutechess-${REPO_BRANCH}-${COMMIT_SHA}-linux-x86_64-debug.tar.gz"
          tar -C destdir -czf "$FILENAME" .
          echo "PACKAGE_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Create tag for commit (if needed)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd "$WORK/cutechess"
          TAG="cutechess-${REPO_BRANCH}-${COMMIT_SHA}"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          git tag "$TAG" || true
          git push origin "$TAG" || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME || github.ref_name }}
          name: cutechess ${{ env.TAG_NAME || github.ref_name }}
          files: ${{ github.workspace }}/${{ env.PACKAGE_FILE }}
          body: |
            cutechess snapshot build (Debug + ASan)
            Branch: ${{ env.REPO_BRANCH }}
            Commit: ${{ env.COMMIT_SHA }}
