# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build minecraft mod
on: 
  workflow_dispatch:
    inputs:
      repo_url:
        description: "minecraft mod repo URL"
        required: true
      repo_branch:
        description: "repo branch (leave empty for default branch)"
        required: false
        default: ""
      repo_commit:
        description: "Commit SHA (leave empty for branch HEAD)"
        required: false

jobs:
  build:
    strategy:
      matrix:
        java: [ 25, 21 ]
        distro: [ temurin ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      # 1. We must check out the current repo bare minimum to run local scripts, 
      # OR we can just fetch the target repository directly if that is the goal.
      # Assuming you want to clone the target repository provided in 'repo_url':
      
      - name: Clone repository
        run: |
          TARGET_URL="${{ inputs.repo_url }}"
          TARGET_BRANCH="${{ inputs.repo_branch }}"
          TARGET_COMMIT="${{ inputs.repo_commit }}"
      
          if [ -z "$TARGET_BRANCH" ]; then
            REPO_PATH=$(echo "$TARGET_URL" | sed -E 's|https://github.com/||' | sed 's/\.git$//')
            TARGET_BRANCH=$(gh repo view "$REPO_PATH" --json defaultBranchRef --jq '.defaultBranchRef.name')
          fi
      
          git clone --depth 1 --branch "$TARGET_BRANCH" "$TARGET_URL" target_repo
      
          if [ -n "$TARGET_COMMIT" ]; then
            cd target_repo
            git fetch --depth 1 origin "$TARGET_COMMIT"
            git checkout "$TARGET_COMMIT"
          fi

      - name: validate gradle wrapper
        working-directory: target_repo
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk ${{ matrix.java }}
        working-directory: target_repo
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        working-directory: target_repo
        with:
          # Tuned to look at matrix context since this is an external repo workflow
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: target_repo
        run: chmod +x ./gradlew

      - name: build
        working-directory: target_repo
        run: ./gradlew build

      - name: Capture build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.java }}-${{ matrix.distro }}
          path: |
            target_repo/build/libs/
            target_repo/build/devlibs/
