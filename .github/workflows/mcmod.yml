# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build minecraft mod
on: 
  workflow_dispatch:
    inputs:
      repo:
        description: "minecraft mod repo (owner/repo)"
        required: true
      repo_ref:
        description: "repo branch (leave empty for default branch)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      matrix:
        java: [ 25, 21 ]
        distro: [ temurin ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      # 1. We must check out the current repo bare minimum to run local scripts, 
      # OR we can just fetch the target repository directly if that is the goal.
      # Assuming you want to clone the target repository provided in 'repo_url':
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.repo_ref }}
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Tuned to look at matrix context since this is an external repo workflow
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: target_repo
        run: chmod +x ./gradlew

      - name: build
        working-directory: target_repo
        run: ./gradlew build

      - name: Capture build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.java }}-${{ matrix.distro }}
          path: |
            target_repo/build/libs/
            target_repo/build/devlibs/
